<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActiveFrame - Atividade Física</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <header class="cabecalho-principal">
        <div class="logo">
            <a href="atividade_fisica.html">
                <img src="imagens/logo.png" alt="ActiveFrame Logo" class="logo-img">
            </a>
        </div>

        <nav class="menu-centro">
            <ul>
                <li><a href="atividade_fisica.html" class="link-ativo">Atividade Física</a></li>
                <li><a href="alimentacao.html">Alimentação</a></li>
            </ul>
        </nav>

        <div class="botoes-form">
            <span id="nome-utilizador-topo"></span>
            <button id="btn-logout" onclick="fazerLogout()">Sair</button>
        </div>
    </header>

    <main class="conteudo-principal">
        <div class="introducao">
            <h1>Olá, <span id="nome-utilizador-boas-vindas"></span>!</h1>
            <p>Este é o teu espaço privado. Abaixo encontras o teu histórico de treinos e evolução física.</p>
        </div>

        <section class="zona-formulario">
            <h2 class="titulo-bloco">Registar Nova Atividade</h2>
            <form id="form-nova-atividade" class="form-dados-input">
                <div class="grupo-campos">
                    <div class="campo-input">
                        <label for="act-tipo">Tipo de Exercício:</label>
                        <select id="act-tipo" required>
                            <option value="" disabled selected>Selecione um desporto</option>
                        </select>
                    </div>
                    <div class="campo-input">
                        <label for="act-data">Data:</label>
                        <input type="date" id="act-data" required>
                    </div>
                    <div class="campo-input">
                        <label for="act-local">Local:</label>
                        <input type="text" id="act-local" placeholder="Ex: Parque, Ginásio" required>
                    </div>
                </div>

                <div class="grupo-campos">
                    <div class="campo-input">
                        <label for="act-metricas">Métricas (Distância / Tempo):</label>
                        <input type="text" id="act-metricas" placeholder="Ex: 5.0 Km / 30 min" required>
                    </div>
                    <div class="campo-input">
                        <label for="act-calorias">Calorias Gastas (kcal):</label>
                        <input type="number" id="act-calorias" placeholder="Ex: 350" required>
                    </div>
                    <div class="campo-input">
                        <label for="act-foto">Fotografia do Treino:</label>
                        <input type="file" id="act-foto" accept="image/*">
                    </div>
                </div>

                <div class="campo-input-total">
                    <label for="act-notas">Observações / Notas:</label>
                    <textarea id="act-notas" placeholder="Como correu o treino?" rows="3" required></textarea>
                </div>

                <button type="submit" class="btn-guardar">Guardar Registo</button>
            </form>
        </section>

        <section class="zona-dados">
            <h3 class="titulo-bloco">Registo de Atividades Físicas</h3>
            <div id="contentor-atividades"></div>
        </section>
    </main>

    <footer class="rodape">
        <p>&copy; 2026 ActiveFrame - Grupo inf25tig33.</p>
    </footer>

    <div id="modal-foto" class="modal-foto escondido" onclick="fecharModal()">
        <span class="fechar-modal">&times;</span>
        <img class="conteudo-modal" id="img-modal" src="imagens/placeholder.jpg" alt="Foto em ponto grande">
    </div>

    <script src="js/atividade_fisica.js"></script>
    <script src="js/global.js"></script>
</body>

</html>
